<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta
		name="viewport"
		content="width=device-width,initial-scale=1,viewport-fit=cover"
	/>
	<title>Artistic Creation Environment Fluid Simulation</title>
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			background: #000;
			height: 100%;
			margin: 0;
			overflow: hidden;
			width: 100%;
		}

		body {
			font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			position: relative;
		}

		canvas {
			display: block;
			height: 100%;
			width: 100%;
		}

		#status {
			backdrop-filter: blur(10px);
			background: rgba(5, 10, 24, 0.42);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 999px;
			bottom: 16px;
			color: rgba(226, 232, 240, 0.9);
			font-size: 12px;
			left: 16px;
			opacity: 0;
			padding: 8px 12px;
			position: absolute;
			transform: translateY(10px);
			transition: opacity 180ms ease, transform 180ms ease;
			user-select: none;
			z-index: 5;
		}

		#status.visible {
			opacity: 1;
			transform: translateY(0);
		}
	</style>
</head>
<body data-artistic-fluid-preview="1">
	<canvas></canvas>
	<div id="status" aria-live="polite"></div>
	<script src="./fluid-simulation.js"></script>
</body>
</html>
