<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A.C.E. ASCII World Preview</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            color: #7dd3fc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        body {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        canvas,
        pre {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            pointer-events: none;
            opacity: 0;
        }

        pre {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: pre;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
        }

        #status {
            position: absolute;
            right: 20px;
            bottom: 20px;
            z-index: 3;
            padding: 0.5rem 0.75rem;
            border-radius: 999px;
            background: rgba(2, 6, 23, 0.72);
            color: #e2e8f0;
            font: 600 12px/1.2 system-ui, sans-serif;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #status.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body data-artistic-ascii-preview="1">
    <canvas aria-hidden="true"></canvas>
    <pre class="artistic-creative__ascii" aria-hidden="true"></pre>
    <div id="status" data-artistic-fluid-status></div>
    <script src="./ascii-world.js"></script>
</body>
</html>
